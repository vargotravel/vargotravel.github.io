    <script>
    // Nav scroll behavior (matches other pages)
    const nav = document.getElementById('navbar');
    window.addEventListener('scroll', () => {
      nav.classList.toggle('scrolled', window.scrollY > 50);
    });

    // Personalize greeting from Tally URL param
    function getFirstName() {
      const params = new URLSearchParams(window.location.search);
      const keys = [
        'First_Name', 'first_name', 'firstName', 'firstname',
        'First Name', 'first name', 'name', 'Name'
      ];
      for (const key of keys) {
        const val = params.get(key);
        if (val && val.trim()) return val.trim();
      }
      for (const [, val] of params.entries()) {
        if (val && /^[A-Za-z]{2,20}$/.test(val.trim())) return val.trim();
      }
      return null;
    }

    const name = getFirstName();
    if (name) {
      document.getElementById('greeting').textContent =
        `Thanks for submitting your information, ${name}!`;
    }
  </script>
