
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-sans); }
  .page { max-width: 560px; margin: 0 auto; padding: 2.5rem 1.5rem; }
  .logo { font-size: 13px; font-weight: 500; color: var(--color-text-secondary); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 2.5rem; }
  .greeting { font-size: 22px; font-weight: 500; color: var(--color-text-primary); margin-bottom: 0.5rem; }
  .subtitle { font-size: 15px; color: var(--color-text-secondary); line-height: 1.6; margin-bottom: 2rem; }
  .itinerary-card { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 1.25rem 1.5rem; margin-bottom: 1rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
  .card-label { font-size: 12px; color: var(--color-text-tertiary); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }
  .card-title { font-size: 15px; font-weight: 500; color: var(--color-text-primary); }
  .view-btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; background: var(--color-background-primary); border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); font-size: 13px; font-weight: 500; color: var(--color-text-primary); text-decoration: none; white-space: nowrap; cursor: pointer; transition: background 0.15s; }
  .view-btn:hover { background: var(--color-background-secondary); }
  .view-btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .divider { border: none; border-top: 0.5px solid var(--color-border-tertiary); margin: 1.75rem 0; }
  .no-link { background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 1rem 1.25rem; font-size: 14px; color: var(--color-text-secondary); display: none; }
  .footer { font-size: 13px; color: var(--color-text-tertiary); margin-top: 2rem; }
</style>

<div class="page">
  <div class="logo">Vargo Travel</div>
  <h1 class="greeting" id="greeting">Your itinerary is ready</h1>
  <p class="subtitle">Please review your itinerary below. If you have any questions, reach out anytime.</p>

  <div class="itinerary-card" id="itinerary-card">
    <div>
      <div class="card-label">Your itinerary</div>
      <div class="card-title" id="card-title">Loading...</div>
    </div>
    <a class="view-btn" id="itinerary-link" href="#" target="_blank">
      View
      <svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
    </a>
  </div>

  <div class="no-link" id="no-link">No itinerary link was provided. Please contact your travel advisor.</div>

  <hr class="divider">
  <p class="footer">Sent by Mike Vargo &middot; <a href="https://vargotravel.com" style="color: var(--color-text-secondary);">vargotravel.com</a></p>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const url = params.get('url');
  const name = params.get('name');
  const title = params.get('title');

  if (name) {
    document.getElementById('greeting').textContent = 'Hi ' + name + ', your itinerary is ready';
  }

  if (url) {
    const link = document.getElementById('itinerary-link');
    link.href = url;
    try {
      const u = new URL(url);
      document.getElementById('card-title').textContent = title || u.hostname.replace('www.','');
    } catch(e) {
      document.getElementById('card-title').textContent = title || 'View itinerary';
    }
  } else {
    document.getElementById('itinerary-card').style.display = 'none';
    document.getElementById('no-link').style.display = 'block';
  }
</script>
